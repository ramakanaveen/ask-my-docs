[tool.poetry]
name = "ask-my-docs-backend"
version = "0.1.0"
description = "Agentic document intelligence system backend"
authors = ["Ask My Docs Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"
websockets = "^12.0"

# Database
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"

# Validation & Serialization
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
email-validator = "^2.1.0"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.0"

# AI & LLM (Primary: Google Vertex AI via LangChain 1.0.x)
langchain = "^1.0.8"  # Latest LangChain 1.0.x
langchain-core = "^1.0.7"
langchain-google-vertexai = "^3.0.3"  # Primary: Vertex AI (service account auth)
google-cloud-aiplatform = "^1.128.0"  # Vertex AI SDK
langchain-anthropic = "^1.1.0"  # Optional: Alternative provider
langchain-openai = "^1.0.3"  # Optional: Alternative provider
langchain-community = "^1.0.0a1"
langgraph = "^1.0.3"
anthropic = "^0.74.1"  # Optional
openai = "^2.8.1"  # Optional

# Vector Database (PGVector - PostgreSQL extension)
pgvector = "^0.4.1"
# chromadb = "^0.4.22"  # Replaced by PGVector
# pinecone-client = "^3.0.0"  # Optional: For production scaling

# Document Processing
PyMuPDF = "^1.23.8"
python-pptx = "^0.6.23"
python-docx = "^1.1.0"
openpyxl = "^3.1.2"
Pillow = "^10.2.0"
pytesseract = "^0.3.10"
tabula-py = "^2.9.0"
unstructured = {extras = ["all-docs"], version = "^0.12.0"}

# Embeddings
sentence-transformers = "^2.3.1"

# Task Queue
celery = {extras = ["redis"], version = "^5.3.4"}
redis = "^5.0.1"

# Storage
boto3 = "^1.34.27"  # AWS S3
python-magic = "^0.4.27"

# Export & PDF Generation
weasyprint = "^60.2"
markdown = "^3.5.2"
jinja2 = "^3.1.3"
reportlab = "^4.0.9"

# Utilities
httpx = "^0.26.0"
python-slugify = "^8.0.1"
tenacity = "^8.2.3"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
httpx = "^0.26.0"  # For TestClient

# Code Quality
black = "^24.1.0"
isort = "^5.13.2"
ruff = "^0.1.14"
mypy = "^1.8.0"

# Development
ipython = "^8.20.0"
ipdb = "^0.13.13"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (black handles this)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --strict-markers --cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
